<script id="slide-data" type="application/json">[{"title": "資料明明在，為什麼 AI 找不到？", "subtitle": "從 RAG 的搜尋瓶頸，認識 LLM Wiki 如何把文件整理成知識。", "kind": "opening", "points": [{"title": "文件有存進去", "text": "像一間裝滿文件的倉庫：資料存在，不代表每次都能找到正確那份。"}, {"title": "答案要送到 AI 面前", "text": "搜尋系統先挑資料，語言模型再閱讀與回答；前面漏掉的證據，後面可能無從得知。"}, {"title": "多一層知識導覽", "text": "LLM Wiki 先整理主題、關係與來源，幫後續查詢找到方向。"}], "takeaway": "關鍵在於：能不能把正確證據，送到這一次回答裡。", "source": [0, 2], "note": "先用倉庫與導覽圖比喻。全篇比較的是常見的片段式 RAG 與 LLM Wiki 方法，不暗示所有 RAG 都只有一次向量搜尋。本文以 microsoft/llmwiki 為實作參考；其他同名工具可能不同。"}, {"title": "RAG 的工作，是先找資料再回答", "subtitle": "先把這條路走一遍，就能知道答案可能在哪裡掉隊。", "kind": "pipeline", "points": [{"title": "先替文件做索引", "text": "把文件切成片段，用關鍵字或語意索引建立可搜尋的目錄。"}, {"title": "每次只取一部分", "text": "收到問題後，搜尋並挑選若干片段，放進模型這次實際看到的內容。"}, {"title": "模型根據片段作答", "text": "AI 依取得的內容組織回答；是否完整、是否忠於來源，仍要檢查。"}], "takeaway": "RAG 讓模型讀到外部資料；它不會自動讀遍整個資料庫。", "source": [2], "note": "索引可想成圖書館目錄。Context 是這次打開在桌上的資料。RAG 是先檢索再生成的方法，不限於向量資料庫，也不代表所有系統都會丟棄查詢成果。"}, {"title": "資料變多，正確片段可能被擠出去", "subtitle": "切換圖下方的情境，看「只拿前三筆」的教學例子。", "kind": "ranking", "points": [{"title": "競爭者變多", "text": "新文件若有很多相似用語、舊版本或重複內容，都可能排進候選結果。"}, {"title": "送進模型的名額有限", "text": "這裡固定只取前三筆；正確片段即使有被搜尋到，排第四仍不會被送進去。"}, {"title": "規模不是唯一原因", "text": "如果分類、排序與索引做得好，大型資料庫仍能查得準；圖中順序是人為設定的示意。"}], "takeaway": "資料量增加會放大搜尋設計的弱點，並非「大了就一定失效」。", "source": [2], "note": "操作小型與大量相似文件兩個情境。這是預設排序，Top 3 只是便於解說的設定，不是模型實測、固定機率或所有產品的預設值。實務上也要量測索引與近似搜尋設定。"}, {"title": "只拿到一句話，常會看錯意思", "subtitle": "文件切得太碎，對象、時間與例外條件可能分家。", "kind": "chunks", "points": [{"title": "主詞在上一段", "text": "只看到「保固延長」，卻不知道說的是哪個產品與哪個地區。"}, {"title": "限制在下一段", "text": "真正影響答案的「不適用舊款」可能沒有一起被取回。"}, {"title": "補回上下文", "text": "保留標題、版本、相鄰段落，或用父子段落檢索，能減少斷章取義。"}], "takeaway": "片段內容正確，也可能因為缺少前後文而被用錯。", "source": [2], "note": "所有產品與保固文字皆為虛構例子。用遮住條件的文件說明切分問題。Contextual Retrieval、段落重疊與父子檢索都是可改善的方向；不是只有 Wiki 能處理。"}, {"title": "看起來相似，不代表就是你要的", "subtitle": "語意搜尋擅長找概念；型號、編號與日期也需要精確比對。", "kind": "matching", "points": [{"title": "概念相近能找得到", "text": "「無法連線」與「網路連接失敗」用字不同，意 [0, 1], "note": "這是建議的知識整理流程。microsoft/llmwiki 提供匯入、索引、連結與維護工具；不代表任意批次匯入都會自動完成正確的跨文件推理或矛盾消解。"}, {"title": "同一個問題，現在有路可以追", "subtitle": "以「海燕專案為什麼延期？」對照兩種資料準備方式。", "kind": "compare", "points": [{"title": "片段式查詢先找相似段落", "text": "可能先拿到「延期」的會議記錄，卻漏掉沒有寫這個詞的採購與測試文件。"}, {"title": "Wiki 先找到專案總覽", "text": "總覽已列出交付、零件與驗收的關係，可指引下一步該看哪些證據。"}, {"title": "關鍵說法回來源確認", "text": "沿連結讀採購與測試記錄，核對時間與條件，再回答；摘要本身不是最終證據。"}], "takeaway": "主題頁把分散線索放到同一個入口，減少每次重新摸索。", "source": [0, 1, 3], "note": "比較圖是機制示意，不是兩套產品的效能測試。Wiki 的幫助取決於頁面是否涵蓋問題、連結是否完整，以及 Agent 是否確實追查原文；完善的 RAG 也可以做多步查詢。"}, {"title": "它仍然要搜尋，只是搜尋的材料更有組織", "subtitle": "把「有導覽圖」與「不用找資料」分清楚。", "kind": "query", "points": [{"title": "先查目錄或頁面", "text": "Microsoft 實作提供標題、摘要與內文的加權全文搜尋；不應把它說成必備向量資料庫。"}, {"title": "再跟著關聯閱讀", "text": "Agent 可依題目讀概念頁、人物頁與來源，缺什麼再補查什麼。"}, {"title": "最後整理並標出依據", "text": "找不到足夠證據時保留不確定性；有用的回答可經檢查後保存。"}], "takeaway": "Wiki 改變知識的組織方式，沒有取消檢索這一步。", "source": [1], "note": "Microsoft ARCHITECTURE 描述 queryWiki 的標題、摘要與內文加權關鍵字搜尋。Agent 循連結與補查需要相應流程；跨頁推理並非單次搜尋 API 本身保證的功能。"}, {"title": "知識地圖也會畫錯，而且會過時", "subtitle": "錯誤若被寫進共用主題頁，就可能在後面的回答反覆出現。", "kind": "maintenance", "points": [{"title": "摘要可能漏條件", "text": "若把「部分設備適用」寫成「全部適用」，後續多題都可能沿用錯誤。"}, {"title": "來源更新要追蹤影響", "text": "新版到來、舊資料撤回時，需要找出受影響的頁面、連結與結論。"}, {"title": "結構檢查不等於事實查核", "text": "Lint 可找斷鏈與索引問題；主張是否正確、矛盾如何處理，仍需回原文確認。"}], "takeaway": "LLM Wiki 用前期整理與持續維護，換取後續查詢的便利。", "source": [0, 1], "note": "保存來源位置、版本日期與證據狀態，重要改動人工抽查。資料權限也必須傳遞到衍生摘要；刪除原文後要追蹤受影響的知識，不能只刪檔案或只修斷鏈。"}, {"title": "什麼問題適合 Wiki？什麼時候保留 RAG？", "subtitle": "依問題類型與資料更新方式選擇，避免為了新工具重做一切。", "kind": "choice", "points": [{"title": "精確查一條新資料", "text": "編號、最新價格、剛更新的規範：優先查原始或權威資料，保留版本與精確篩選。"}, {"title": "反覆理解同一領域", "text": "跨文件比較、專案來龍去脈、研究主題整理：可從持續維護的 Wiki 受益。"}, {"title": "龐大資料庫仍需分層", "text": "Wiki 頁面也會變多；需分領域、分層索引與檢索，並計入整理和更新成本。"}], "takeaway": "沒有通用的資料量分界，也沒有「換成 Wiki 就一定更準」。", "source": [0, 1, 2, 4], "note": "這是依機制推導的選擇原則，不是產品排行榜。RAPTOR 與 GraphRAG 也示範了在 RAG 中預建摘要或結構的路線，所以兩者並非互斥。保護資料權限、更新時效和精確值同樣重要。"}, {"title": "實用的做法：Wiki 帶路，RAG 補證據", "subtitle": "保留原文的搜尋能力，再加上可重用的知識整理層。", "kind": "hybrid", "points": [{"title": "先從主題頁定位", "text": "如果已有可靠專案頁，就利用它的關係與來源線索縮小範圍。"}, {"title": "缺資料就回原文找", "text": "用全文、語意或條件篩選找細節；必要時把問題拆成幾個子問題。"}, {"title": "查證後才更新知識", "text": "答案附來源，重要新發現經確認再寫回 Wiki，避免把猜測累積成「知識」。"}], "takeaway": "整理與檢索可以合作：先理解全貌，再取回精確證據。", "source": [1, 2, 3, 4], "note": "這是建議整合架構，不宣稱 Microsoft 擴充套件預設內建圖中所有搜尋與審核步驟。具體組合依現有系統、權限與資料規模設計。"}, {"title": "怎麼知道真的改善了？用真實問題驗證", "subtitle": "同一批來源、同一組題目，才能比較改動前後。", "kind": "evaluation", "points": [{"title": "準備有標準證據的題目", "text": "涵蓋精確型號、跨文件關係、最新版本與「資料不足」的問題。"}, {"title": "分開看搜尋與回答", "text": "檢查必需證據是否到位，再檢查回答有無漏條件、引用是否支持主張。"}, {"title": "一起計算維護代價", "text": "比較延遲、匯入與更新成本；新增和刪除資料後重測，並確認權限未外洩。"}], "takeaway": "成功標準是正確、可追溯、更新得動，而非只看回答流暢。", "source": [2, 3, 4, 5], "note": "不要捏造改善百分比。先做一個可人工查核的小規模試點，保留相同的資料版本與題目，比較片段式 RAG、改良檢索與 Wiki 混合路線。可量測證據召回、引用支持度、答案完整性、時效、延遲與成本。"}, {"title": "從文件倉庫，走向可追查的知識", "subtitle": "先用一個主題做小規模試點，再決定如何擴大。", "kind": "closing", "points": [{"title": "先修「找不到」的關卡", "text": "檢查資料擷取、切分、篩選、排序與證據是否送到模型；不要先假設是模型不夠聰明。"}, {"title": "再加一層主題與關係", "text": "對反覆查詢的領域，用 LLM Wiki 保存整理成果，並保留通往原始證據的路。"}, {"title": "最後讓更新與查核持續運作", "text": "用真實問題驗證品質，追蹤版本與變更，讓整理出的知識保持可靠。"}], "takeaway": "RAG 幫你找片段；LLM Wiki 幫你預先整理關係；可靠答案還要回到證據。", "source": [0, 1, 2], "note": "收尾不以工具取代工具，而是指出搜尋、組織與驗證各自的作用。這份簡報的互動皆為瀏覽器內的教學示意，沒有安裝或連接真正的 RAG 或 LLM Wiki 服務。"}]</script>

const total=slides.reduce((n,s)=>n+1+s.points.length,0);
function render(){const s=slides[page],focused=step>=0,current=slides.slice(0,page).reduce((n,s)=>n+1+s.points.length,0)+step+2;
$('chapter').textContent=page<7?'為什麼找不到':page<12?'Wiki 如何幫忙':'如何可靠地使用';$('page-counter').textContent=`${page+1} / ${slides.length} 章`;
$('slide-title').textContent=s.title;$('slide-subtitle').textContent=s.subtitle;$('takeaway').textContent=s.takeaway;
$('report-summary').hidden=focused;$('report-focus').hidden=!focused;
$('report-points').innerHTML=s.points.map(p=>`<div class="point"><h2>${esc(p.title)}</h2><p>${esc(p.text)}</p></div>`).join('');
if(focused){$('step-title').textContent=s.points[step].title;$('step-text').textContent=s.points[step].text;$('step-count').textContent=`${step+1} / ${s.points.length}`;}
$('art').innerHTML=scene();$('scenario').hidden=s.kind!=='ranking';$('small').setAttribute('aria-pressed',String(!large));$('large').setAttribute('aria-pressed',String(large));
$('scene-caption').textContent=s.kind==='ranking'?'人為設定的排序示意，非實測結果或效果保證':'點圖中節點，或按 → 逐段講解';
$('detail').innerHTML='依據：'+s.source.map(n=>`<a href="${sources[n].url}" target="_blank" rel="noopener noreferrer">${esc(sources[n].title)}</a>`).join('、');
$('chapter-position').textContent=`章節 ${page+1} / ${slides.length}　${focused?`圖解 ${step+1} / ${s.points.length}`:'總覽'}`;
$('total-position').textContent=`${current} / ${total} 頁`;$('track').style.width=`${current/total*100}%`;
$('prev').disabled=page===0&&step===-1;$('next').disabled=page===slides.length-1&&step===s.points.length-1;
$('announcement').textContent=`${current} / ${total} 頁，${s.title}${focused?'，'+s.points[step].title:'，總覽'}`;
document.title=s.title+'｜從 RAG 到 LLM Wiki';
try{localStorage.setItem('presentation-hub:progress:rag-to-wiki',JSON.stringify({slide:page+1,total:slides.length,visitedAt:Date.now()}));}catch{}
}
function go(n,write=true){page=Math.max(0,Math.min(slides.length-1,n));step=-1;render();$('main').scrollTop=0;if(write)history.replaceState(null,'',`#slide-${page+1}`);}
function move(delta){if(delta>0){if(step<slides[page].points.length-1){step++;render();}else if(page<slides.length-1)go(page+1);}else if(step>=0){step--;render();}else if(page>0){go(page-1);step=slides[page].points.length-1;render();}}
function readHash(){const m=location.hash.match(/^#slide-(\d+)$/);return m?Number(m[1])-1:0;}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}}
function openResources(){ $('deck-menu').open=false;$('resources').showModal(); }
$('resources-body').innerHTML=`<h3>這份簡報比較什麼？</h3><p>比較常見的片段式 RAG 與模型維護 Wiki 的方法，以 <a href="${sources[0].url}" target="_blank" rel="noopener noreferrer">microsoft/llmwiki</a> 為實作參考。同名專案可能不同。RAG 包含多種檢索設計；Wiki 也需要檢索，兩者可以結合。</p><p>文件、專案、排序與圖中情境皆為教學示意，沒有模型呼叫、後端搜尋或實測準確率。查核日期：2026-10-27。</p><h3>原始資料與研究</h3><ol>${sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><small>${esc(s.scope)}</small></li>`).join('')}</ol><h3>各章延伸說明</h3>${slides.map((s,i)=>`<details><summary>${i+1}. ${esc(s.title)}</summary><p>${esc(s.note)}</p></details>`).join('')}<h3>講稿與操作</h3><p><a href="notes.html">開啟簡易講稿</a> · <a href="speaker-notes.md">純文字版本</a></p><p>←／→ 依序走過總覽與圖解，章末接下一章。↑／↓、空白鍵切章，Shift＋空白回上一章。Home／End 到首尾頁，F 切換全螢幕。所有切換皆由你操作。</p>`;
$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('overview').addEventListener('click',()=>{step=-1;render();});
$('art').addEventListener('click',e=>{const n=e.target.closest('[data-step]');if(n){step=Number(n.dataset.step);render();}});
$('art').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-step]')){e.preventDefault();e.stopPropagation();const n=Number(e.target.dataset.step);step=n;render();const current=$('art').querySelector(`[data-step="${n}"]`);current?.focus();}});
$('small').addEventListener('click',()=>{large=false;render();});$('large').addEventListener('click',()=>{large=true;render();});
$('fullscreen').addEventListener('click',fullscreen);$('menu-fullscreen').addEventListener('click',()=>{$('deck-menu').open=false;fullscreen();});
$('sources-open').addEventListener('click',openResources);$('menu-sources').addEventListener('click',openResources);$('resources-close').addEventListener('click',()=>$('resources').close());
document.addEventListener('click',e=>{if(!e.target.closest('#deck-menu'))$('deck-menu').open=false;});
document.addEventListener('keydown',e=>{if($('resources').open||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,summary'))return;
if(e.key===' '&&e.target.closest('button,a,[role=button]'))return;
if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();move(e.key==='ArrowRight'?1:-1);}
else if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key===' '){e.preventDefault();const d=e.key==='ArrowUp'||(e.key===' '&&e.shiftKey)?-1:1;const n=page+d;if(n>=0&&n<slides.length)go(n);}
else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(slides.length-1);step=slides[page].points.length-1;render();}
else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen();}else if(e.key==='Escape')$('deck-menu').open=false;
});
window.addEventListener('hashchange',()=>go(readHash(),false));go(readHash());
})();
</script></body></html>
