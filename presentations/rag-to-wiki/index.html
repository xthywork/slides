<script id="slide-data" type="application/json">[{"title": "RAG：先搜尋，只把前 N 筆交給 AI", "subtitle": "由左到右：文件資料庫 → 取前 N 筆 → AI 閱讀回答。", "kind": "pipeline", "points": [{"title": "準備可搜尋的文件", "text": "先把文件切成片段、建立索引，放進資料庫。"}, {"title": "只取排名靠前的結果", "text": "N 是這次要拿的筆數，不是整個資料庫。"}, {"title": "AI 根據拿到的內容回答", "text": "沒有進到這次閱讀範圍的證據，就可能被漏掉。"}], "takeaway": "資料有存進去，不代表回答時一定看得到。", "source": [2], "note": "0:00–0:35（35 秒）。從左到右看：文件先切分、建立索引；你提出問題後，搜尋只取排名前 N 筆；最後 AI 依選中的內容回答。下面的綠色提示是重點：AI 這次看到的只有 N 筆，不是整個資料庫。"}, {"title": "排在第 N＋1 筆，就可能被漏掉", "subtitle": "這裡只取前三筆：切換情境，看正確資料如何掉出名單。", "kind": "ranking", "points": [{"title": "相似文件多了", "text": "舊版本、重複記錄或別的專案，都可能占住前排。"}, {"title": "正確資料被擠到第四", "text": "資料還在，但只拿前三筆時，AI 這次就看不到它。"}, {"title": "漏掉的是證據", "text": "回答可能不完整，甚至誤以為資料沒有說明原因。"}], "takeaway": "「沒被選中」不等於「資料不存在」。", "source": [2], "note": "0:35–1:35（60 秒）。先選小型資料庫，正確記錄排第一。再切到大量相似文件，正確記錄變成第四，前三個名額已被占滿。這是人為設定的排序示意，不是效能測試；資料量大不一定會失敗，但會放大排序與名額限制的問題。"}, {"title": "找到一個片段，還不一定湊得出答案", "subtitle": "採購、測試、會議三份記錄，分別藏著原因鏈的一部分。", "kind": "multihop", "points": [{"title": "零件晚到：先看採購記錄", "text": "這是原因：設備缺少必要零件。"}, {"title": "驗收延後：再看測試記錄", "text": "零件沒到，驗收就無法按時完成。"}, {"title": "交付延期：最後看會議記錄", "text": "驗收延後，所以無法依原定時間交付。"}], "takeaway": "需要的是一條解釋的路，不只是幾段相似文字。", "source": [3, 4], "note": "1:35–2:20（45 秒）。沿著由左到右的箭頭講：採購記錄顯示零件晚到，導致測試記錄中的驗收延後，最後會議記錄宣布交付延期。如果只搜尋到最後一份，就只知道結果、不知道前面的原因。這些記錄是虛構教學情境。"}, {"title": "LLM Wiki：先把文件整理成知識網", "subtitle": "每次加入新資料，就整理摘要、更新概念與來源之間的連結。", "kind": "knowledge", "points": [{"title": "先替資料寫摘要", "text": "讀新資料時，把重點與來源留下來。"}, {"title": "相同概念整理在一起", "text": "把「零件晚到、驗收、延期」連成可理解的關係。"}, {"title": "新資料持續更新概念頁", "text": "下一次提問，可以沿用已整理的知識。"}], "takeaway": "把整理工作先做好，留下能反覆閱讀的概念與關係。", "source": [0, 1], "note": "2:20–3:25（65 秒）。Wiki 像整理員：讀過文件後，寫下摘要，把同一專案、概念與原因互相連結。之後加入新資料，更新原有的概念頁，不必每次都從散落片段重新拼起。知識網可以由互相連結的 Markdown 頁面構成，不一定需要圖形資料庫。摘要應在匯入或整理新發現時更新，不代表每次提問都會自動寫回。"}, {"title": "海燕專案為什麼延期？", "subtitle": "Wiki 已把原因與影響整理在一起，直接讀摘要就能掌握全貌。", "kind": "concept", "points": [{"title": "先讀整理好的答案", "text": "Wiki 已把跨文件的重點整理成一頁摘要。"}, {"title": "沿箭頭看懂因果", "text": "零件晚到 → 驗收延後 → 交付延期。"}, {"title": "每一步都能追到來源", "text": "需要查核時，分別打開下方的採購、測試與會議原文。"}], "takeaway": "從「每次找片段來拼」，變成「讀概念，再追證據」。", "source": [0, 1], "note": "3:25–4:25（60 秒）。這次不用從零拼湊：Wiki 的概念摘要已把「零件晚到 → 驗收延後 → 交付延期」整理好。先沿左到右的箭頭讀答案，再往下對照每個環節的原始記錄。Wiki 保存了已整理的關係，讓 AI 能先理解概念，再查核細節。"}, {"title": "一句話：RAG 找片段，Wiki 先整理知識", "subtitle": "兩者可以一起用：Wiki 帶路，原文搜尋補細節。", "kind": "closing", "points": [{"title": "RAG 的風險", "text": "只拿前 N 筆時，可能漏掉排名後面的關鍵證據。"}, {"title": "Wiki 的幫助", "text": "預先累積摘要與概念關係，讓 AI 更容易理解全貌。"}, {"title": "仍要保留來源", "text": "摘要要更新，關鍵說法回原文確認。"}], "takeaway": "先有知識地圖，再找細節，比每次從一堆片段重新開始更有方向。", "source": [0, 1, 2], "note": "4:25–5:00（35 秒）。收尾只留兩個概念：RAG 可能因前 N 筆限制漏掉資料；Wiki 先整理摘要和關係，讓下次可以直接讀概念。Wiki 沒有讓搜尋消失，也不是保證正確；它的價值在於把理解成果保存下來。"}]</script>

s=`<rect x="12" y="18" width="736" height="289" rx="16" fill="#eef6f1" stroke="#bdd9cd" stroke-width="2"/><g data-step="0" role="button" tabindex="0" aria-label="閱讀 Wiki 已整理好的概念摘要" aria-pressed="${step===0}" class="${step===0?'active':''}"><rect class="tile" x="29" y="35" width="702" height="79" rx="10" fill="#fff"/>${icon('book',48,45,54)}${txt(417,85,'Wiki 已整理好的答案',28)}</g>${causeCards(true)}<g data-step="2" role="button" tabindex="0" aria-label="沿連結查核採購、測試與會議原文" aria-pressed="${step===2}" class="${step===2?'active':''}"><rect class="tile" x="15" y="355" width="730" height="65" rx="11" fill="#fff"/>${[0,1,2].map(i=>{const x=25+i*255;return `${arrow(`M${x+100} 314v28`,true)}${icon('doc',x+17,366,37)}${txt(x+121,396,['採購原文','測試原文','會議原文'][i],20)}`}).join('')}</g>`;
}else{
s=`${node(0,35,137,'RAG：找前 N 筆','search',203,127)}${arrow('M249 200H273')}${node(1,285,137,'Wiki：整理概念','book',203,127)}${arrow('M498 200H523')}${node(2,535,137,'原文：查核細節','check',190,127)}${txt(380,70,'找片段 → 懂概念 → 查證據',27)}${txt(380,335,'搜尋 ＋ 整理 ＋ 驗證',28,'#168773')}${txt(380,384,'摘要與關係，讓理解可以累積',18,'#5c6b78')}`;
}
return `<svg viewBox="0 0 760 430" role="group" aria-label="${esc(slides[page].title)}互動圖解">${symbols}${s}</svg>`;
}
const total=slides.length;
function render(){const s=slides[page],focused=step>=0,current=page+1;
$('chapter').textContent=page<3?'為什麼漏掉資料':page<5?'Wiki 如何幫忙':'重點回顧';$('page-counter').textContent=`${page+1} / ${slides.length} 頁`;
$('slide-title').textContent=s.title;$('slide-subtitle').textContent=s.subtitle;$('takeaway').textContent=s.takeaway;
$('report-summary').hidden=focused;$('report-focus').hidden=!focused;
$('report-points').innerHTML=s.points.map(p=>`<div class="point"><h2>${esc(p.title)}</h2><p>${esc(p.text)}</p></div>`).join('');
if(focused){$('step-title').textContent=s.points[step].title;$('step-text').textContent=s.points[step].text;$('step-count').textContent=`${step+1} / ${s.points.length}`;}
$('art').innerHTML=scene();$('scenario').hidden=s.kind!=='ranking';$('small').setAttribute('aria-pressed',String(!large));$('large').setAttribute('aria-pressed',String(large));
$('scene-caption').textContent=s.kind==='ranking'?'人為設定的排序示意，非實測結果或效果保證':'點圖中節點可聚焦說明；按 → 到下一頁';
$('detail').innerHTML='依據：'+s.source.map(n=>`<a href="${sources[n].url}" target="_blank" rel="noopener noreferrer">${esc(sources[n].title)}</a>`).join('、');
$('chapter-position').textContent=`5 分鐘簡報　${focused?'聚焦說明':'總覽'}`;
$('total-position').textContent=`${current} / ${total} 頁`;$('track').style.width=`${current/total*100}%`;
$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;
$('announcement').textContent=`${current} / ${total} 頁，${s.title}${focused?'，'+s.points[step].title:'，總覽'}`;
document.title=s.title+'｜從 RAG 到 LLM Wiki';
try{localStorage.setItem('presentation-hub:progress:rag-to-wiki',JSON.stringify({slide:page+1,total:slides.length,visitedAt:Date.now()}));}catch{}
}
function go(n,write=true){page=Math.max(0,Math.min(slides.length-1,n));step=-1;render();$('main').scrollTop=0;if(write)history.replaceState(null,'',`#slide-${page+1}`);}
function move(delta){const n=page+delta;if(n>=0&&n<slides.length)go(n);}
function readHash(){const m=location.hash.match(/^#slide-(\d+)$/);return m?Number(m[1])-1:0;}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}}
function openResources(){ $('deck-menu').open=false;$('resources').showModal(); }
$('resources-body').innerHTML=`<h3>這份簡報比較什麼？</h3><p>5 分鐘比較「RAG 取前 N 筆」與「Wiki 預先整理概念」，以 <a href="${sources[0].url}" target="_blank" rel="noopener noreferrer">microsoft/llmwiki</a> 為實作參考。同名專案可能不同。RAG 包含多種檢索設計；Wiki 也需要檢索，兩者可以結合。</p><p>文件、專案、排序與圖中情境皆為教學示意，沒有模型呼叫、後端搜尋或實測準確率。查核日期：2026-10-27。</p><h3>原始資料與研究</h3><ol>${sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><small>${esc(s.scope)}</small></li>`).join('')}</ol><h3>5 分鐘講述節奏</h3>${slides.map((s,i)=>`<details><summary>${i+1}. ${esc(s.title)}</summary><p>${esc(s.note)}</p></details>`).join('')}<h3>講稿與操作</h3><p><a href="notes.html">開啟簡易講稿</a> · <a href="speaker-notes.md">純文字版本</a></p><p>←／→、↑／↓ 切換六頁；空白鍵下一頁，Shift＋空白回上一頁。點圖中節點可聚焦說明，不增加頁數。Home／End 到首尾頁，F 切換全螢幕。</p>`;
$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('overview').addEventListener('click',()=>{step=-1;render();});
$('art').addEventListener('click',e=>{const n=e.target.closest('[data-step]');if(n){step=Number(n.dataset.step);render();}});
$('art').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-step]')){e.preventDefault();e.stopPropagation();const n=Number(e.target.dataset.step);step=n;render();const current=$('art').querySelector(`[data-step="${n}"]`);current?.focus();}});
$('small').addEventListener('click',()=>{large=false;render();});$('large').addEventListener('click',()=>{large=true;render();});
$('fullscreen').addEventListener('click',fullscreen);$('menu-fullscreen').addEventListener('click',()=>{$('deck-menu').open=false;fullscreen();});
$('sources-open').addEventListener('click',openResources);$('menu-sources').addEventListener('click',openResources);$('resources-close').addEventListener('click',()=>$('resources').close());
document.addEventListener('click',e=>{if(!e.target.closest('#deck-menu'))$('deck-menu').open=false;});
document.addEventListener('keydown',e=>{if($('resources').open||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,summary'))return;
if(e.key===' '&&e.target.closest('button,a,[role=button]'))return;
if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();move(e.key==='ArrowRight'?1:-1);}
else if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key===' '){e.preventDefault();const d=e.key==='ArrowUp'||(e.key===' '&&e.shiftKey)?-1:1;const n=page+d;if(n>=0&&n<slides.length)go(n);}
else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(slides.length-1);}
else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen();}else if(e.key==='Escape')$('deck-menu').open=false;
});
window.addEventListener('hashchange',()=>go(readHash(),false));go(readHash());
})();
</script></body></html>
