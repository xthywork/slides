<script id="slide-data" type="application/json">[{"title": "RAG：先搜尋，只把前 N 筆交給 AI", "subtitle": "文件很多，但 AI 每次只讀搜尋選中的那一小部分。", "kind": "pipeline", "points": [{"title": "準備可搜尋的文件", "text": "先把文件切成片段、建立索引，放進資料庫。"}, {"title": "只取排名靠前的結果", "text": "N 是這次要拿的筆數，不是整個資料庫。"}, {"title": "AI 根據拿到的內容回答", "text": "沒有進到這次閱讀範圍的證據，就可能被漏掉。"}], "takeaway": "資料有存進去，不代表回答時一定看得到。", "source": [2], "note": "0:00–0:35（35 秒）。用圖上的問題帶入：專案為什麼延期？由左到右，資料庫保存全部片段，搜尋只選前 N 筆，AI 再依這些片段回答。沒有入選的內容，這次不會被看到。"}, {"title": "排在第 N＋1 筆，就可能被漏掉", "subtitle": "這裡只取前三筆：切換情境，看正確資料如何掉出名單。", "kind": "ranking", "points": [{"title": "相似文件多了", "text": "舊版本、重複記錄或別的專案，都可能占住前排。"}, {"title": "排名決定能不能被讀到", "text": "固定只取前三筆；正確片段若掉到第四，就不會進入回答。"}, {"title": "漏掉的是證據", "text": "回答可能不完整，甚至誤以為資料沒有說明原因。"}], "takeaway": "「沒被選中」不等於「資料不存在」。", "source": [2], "note": "0:35–1:35（60 秒）。畫面先呈現大量相似文件：正確記錄排第四，沒有進入前三筆。可切到小型資料庫對照，它排第一就會被取回，再切回大量相似文件。排序是人為設定的教學示意，不是效能測試；資料量大不一定失敗，但會放大排序與名額限制的問題。"}, {"title": "找到一個片段，還不一定湊得出答案", "subtitle": "一份說零件、一份說驗收、一份說交付；答案分散在三處。", "kind": "multihop", "points": [{"title": "採購記錄：零件沒到", "text": "說明了零件的狀態。"}, {"title": "測試記錄：驗收要等零件", "text": "補上零件與驗收的關係。"}, {"title": "會議記錄：交付隨驗收順延", "text": "只找到這份，仍少了前面的原因。"}], "takeaway": "需要的是一條解釋的路，不只是幾段相似文字。", "source": [3, 4], "note": "1:35–2:20（45 秒）。三份原始記錄各自說明一部分：零件尚未到貨，驗收要等零件，交付又要等驗收。只拿到會議記錄，還不能完整解釋延期。海燕專案及記錄均為虛構教學情境。"}, {"title": "LLM Wiki：先把文件整理成知識網", "subtitle": "每次加入新資料，就整理摘要、更新概念與來源之間的連結。", "kind": "knowledge", "points": [{"title": "先替資料寫摘要", "text": "讀新資料時，把重點與來源留下來。"}, {"title": "相同概念整理在一起", "text": "把「零件晚到、驗收、延期」連成可理解的關係。"}, {"title": "新資料持續更新概念頁", "text": "下一次提問，可以沿用已整理的知識。"}], "takeaway": "把整理工作先做好，留下能反覆閱讀的概念與關係。", "source": [0, 1], "note": "2:20–3:25（65 秒）。Wiki 像整理員：讀過文件後，寫下摘要，把同一專案、概念與原因互相連結。之後加入新資料，更新原有的概念頁，不必每次都從散落片段重新拼起。知識網可以由互相連結的 Markdown 頁面構成，不一定需要圖形資料庫。摘要應在匯入或整理新發現時更新，不代表每次提問都會自動寫回。"}, {"title": "海燕專案為什麼延期？", "subtitle": "先讀整理好的概念摘要，需要證據時再打開來源。", "kind": "concept", "points": [{"title": "先讀整理好的答案", "text": "Wiki 已把跨文件的重點整理成一頁摘要。"}, {"title": "沿箭頭看懂因果", "text": "零件晚到 → 驗收延後 → 交付延期。"}, {"title": "點來源，就能核對記錄", "text": "下方三個來源按鈕，可查看對應的虛構教學記錄。"}], "takeaway": "從「每次找片段來拼」，變成「讀概念，再追證據」。", "source": [0, 1], "note": "3:25–4:25（60 秒）。先讀 Wiki 已整理好的摘要：關鍵零件晚到，讓驗收與交付都延後。再沿原因鏈閱讀三個環節。下方編號對應三份來源，點選按鈕可查看清楚標示為虛構的教學記錄。Wiki 的價值在於保存理解後的摘要與關係，不必每次從零拼湊。"}, {"title": "一句話：RAG 找片段，Wiki 先整理知識", "subtitle": "兩者可以一起用：Wiki 帶路，原文搜尋補細節。", "kind": "closing", "points": [{"title": "RAG 的風險", "text": "只拿前 N 筆時，可能漏掉排名後面的關鍵證據。"}, {"title": "Wiki 的幫助", "text": "預先累積摘要與概念關係，讓 AI 更容易理解全貌。"}, {"title": "仍要保留來源", "text": "摘要要更新，關鍵說法回原文確認。"}], "takeaway": "先有知識地圖，再找細節，比每次從一堆片段重新開始更有方向。", "source": [0, 1, 2], "note": "4:25–5:00（35 秒）。收尾只留兩個概念：RAG 可能因前 N 筆限制漏掉資料；Wiki 先整理摘要和關係，讓下次可以直接讀概念。Wiki 沒有讓搜尋消失，也不是保證正確；它的價值在於把理解成果保存下來。"}]</script>

 return `<div class="visual"><div class="v-question">${glyph('search')}這次只取前三筆</div><div class="rank-demo"><ol class="ranking-list">${rows.map((v,i)=>`<li class="${i<3?'chosen':''} ${v==='海燕採購原因'?'needed':''} ${i===3&&large?'missed':''}"><span>${i+1}</span><span>${v}</span><small class="rank-badge">${i<3?'送進 AI':i===3&&large?'漏掉關鍵':''}</small></li>`).join('')}</ol><button ${focus(large?2:1,'rank-note')}>${glyph(large?'doc':'check')}<strong>${large?'正確資料在第四筆':'正確資料在第一筆'}</strong><p>${large?'它仍在資料庫裡，但沒有進入這次回答。':'它在前三筆內，AI 這次可以讀到。'}</p></button></div><div class="v-bottom">問題是<strong>關鍵證據有沒有入選</strong>，不是資料存不存在。</div></div>`;
}
if(k==='multihop')return `<div class="visual"><div class="v-question">${glyph('doc')}三份記錄，各只說了一部分</div><div class="proof-grid">${evidence.map((e,i)=>`<button ${focus(i,'proof'+(i===2?' result':''))}>${glyph('doc')}<small>${e.title}</small><strong>${['關鍵零件<br>尚未到貨','等零件到齊<br>才能驗收','尚未完成驗收<br>交付順延'][i]}</strong></button>`).join('')}</div><div class="v-bottom">只拿到會議記錄，就只知道<strong>結果</strong>，看不到完整原因。</div></div>`;
if(k==='knowledge')return `<div class="visual"><div class="v-question">${glyph('book')}每次加入資料，更新摘要與連結</div><div class="knowledge-work"><button ${focus(0,'new-source')}>${glyph('doc')}<small>讀取新資料</small><strong>零件晚到</strong></button>${flowArrow()}<div class="concept-network"><button ${focus(1,'concept-root')}>${glyph('book')}海燕專案</button><div class="network-stem"></div><div class="network-leaves"><span>零件供應</span><span>驗收作業</span><span>交付安排</span></div></div></div><button ${focus(2,'summary-update')}>${glyph('link')}更新概念摘要，留下關係與來源</button></div>`;
if(k==='concept')return `<div class="visual wiki-article"><div class="wiki-label">${glyph('book')}Wiki 概念摘要 · 海燕專案</div><button ${focus(0,'wiki-heading')}>交付延期</button><p class="wiki-summary">關鍵零件晚到，<br>讓<strong>驗收與交付都延後</strong>。</p><button ${focus(1,'cause-chain')} aria-label="原因鏈：零件晚到，驗收延後，交付延期">${['零件晚到','驗收延後','交付延期'].map((v,i)=>`<span class="cause-event">${glyph(['box','test','delivery'][i])}<strong>${v}<sup>${i+1}</sup></strong></span>${i<2?flowArrow():''}`).join('')}</button>${sourceButtons()}</div>`;
return `<div class="visual"><div class="compare-grid"><button ${focus(0,'compare-col')}>${glyph('search')}<span>RAG</span><strong>先找片段</strong><p>前 N 筆沒有選中關鍵資料，<br>這次回答就可能漏掉。</p></button><button ${focus(1,'compare-col wiki')}>${glyph('book')}<span>LLM Wiki</span><strong>先整理概念</strong><p>先累積摘要與知識關係，<br>下次可以直接讀概念。</p></button></div><button ${focus(2,'summary-update')}>${glyph('check')}兩者都要保留來源，查核關鍵細節。</button></div>`;
}

const total=slides.length;
function render(){const s=slides[page],focused=step>=0,current=page+1;
$('chapter').textContent=page<3?'為什麼漏掉資料':page<5?'Wiki 如何幫忙':'重點回顧';$('page-counter').textContent=`${page+1} / ${slides.length} 頁`;
$('slide-title').textContent=s.title;$('slide-subtitle').textContent=s.subtitle;$('takeaway').textContent=s.takeaway;
$('report-summary').hidden=focused;$('report-focus').hidden=!focused;
$('report-points').innerHTML=s.points.map(p=>`<div class="point"><h2>${esc(p.title)}</h2><p>${esc(p.text)}</p></div>`).join('');
if(focused){$('step-title').textContent=s.points[step].title;$('step-text').textContent=s.points[step].text;$('step-count').textContent=`${step+1} / ${s.points.length}`;}
$('art').innerHTML=scene();$('scenario').hidden=s.kind!=='ranking';$('small').setAttribute('aria-pressed',String(!large));$('large').setAttribute('aria-pressed',String(large));
$('scene-caption').textContent=s.kind==='ranking'?'預設排序教學示意，非實測結果':s.kind==='concept'?'來源按鈕可查看虛構教學記錄':'點圖文可聚焦說明；按 → 到下一頁';
$('detail').innerHTML='依據：'+s.source.map(n=>`<a href="${sources[n].url}" target="_blank" rel="noopener noreferrer">${esc(sources[n].title)}</a>`).join('、');
$('chapter-position').textContent=`5 分鐘簡報　${focused?'聚焦說明':'總覽'}`;
$('total-position').textContent=`${current} / ${total} 頁`;$('track').style.width=`${current/total*100}%`;
$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;
$('announcement').textContent=`${current} / ${total} 頁，${s.title}${focused?'，'+s.points[step].title:'，總覽'}`;
document.title=s.title+'｜從 RAG 到 LLM Wiki';
try{localStorage.setItem('presentation-hub:progress:rag-to-wiki',JSON.stringify({slide:page+1,total:slides.length,visitedAt:Date.now()}));}catch{}
}
function go(n,write=true){document.activeElement?.blur();page=Math.max(0,Math.min(slides.length-1,n));step=-1;render();$('main').scrollTop=0;if(write)history.replaceState(null,'',`#slide-${page+1}`);}
function move(delta){const n=page+delta;if(n>=0&&n<slides.length)go(n);}
function readHash(){const m=location.hash.match(/^#slide-(\d+)$/);return m?Number(m[1])-1:0;}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}}
function openResources(){ $('deck-menu').open=false;$('resources').showModal(); }
$('resources-body').innerHTML=`<h3>這份簡報比較什麼？</h3><p>5 分鐘比較「RAG 取前 N 筆」與「Wiki 預先整理概念」，以 <a href="${sources[0].url}" target="_blank" rel="noopener noreferrer">microsoft/llmwiki</a> 為實作參考。同名專案可能不同。RAG 包含多種檢索設計；Wiki 也需要檢索，兩者可以結合。</p><p>文件、專案、排序與圖中情境皆為教學示意，沒有模型呼叫、後端搜尋或實測準確率。查核日期：2026-10-27。</p><h3>原始資料與研究</h3><ol>${sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><small>${esc(s.scope)}</small></li>`).join('')}</ol><h3>5 分鐘講述節奏</h3>${slides.map((s,i)=>`<details><summary>${i+1}. ${esc(s.title)}</summary><p>${esc(s.note)}</p></details>`).join('')}<h3>講稿與操作</h3><p><a href="notes.html">開啟簡易講稿</a> · <a href="speaker-notes.md">純文字版本</a></p><p>←／→、↑／↓ 切換六頁；空白鍵下一頁，Shift＋空白回上一頁。點圖中節點可聚焦說明，不增加頁數。Home／End 到首尾頁，F 切換全螢幕。</p>`;
$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('overview').addEventListener('click',()=>{step=-1;render();});
$('art').addEventListener('click',e=>{const source=e.target.closest('[data-evidence]');if(source){const item=evidence[Number(source.dataset.evidence)];$('evidence-title').textContent=item.title;$('evidence-text').textContent=item.text;$('evidence').showModal();return;}const n=e.target.closest('[data-step]');if(n){step=Number(n.dataset.step);render();$('art').querySelector(`[data-step="${step}"]`)?.focus({preventScroll:true});}});
$('small').addEventListener('click',()=>{large=false;render();});$('large').addEventListener('click',()=>{large=true;render();});
$('fullscreen').addEventListener('click',fullscreen);$('menu-fullscreen').addEventListener('click',()=>{$('deck-menu').open=false;fullscreen();});
$('sources-open').addEventListener('click',openResources);$('menu-sources').addEventListener('click',openResources);$('resources-close').addEventListener('click',()=>$('resources').close());$('evidence-close').addEventListener('click',()=>$('evidence').close());
document.addEventListener('click',e=>{if(!e.target.closest('#deck-menu'))$('deck-menu').open=false;});
document.addEventListener('keydown',e=>{if($('resources').open||$('evidence').open||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,summary'))return;
if(e.key===' '&&e.target.closest('button,a,[role=button]'))return;
if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();move(e.key==='ArrowRight'?1:-1);}
else if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key===' '){e.preventDefault();const d=e.key==='ArrowUp'||(e.key===' '&&e.shiftKey)?-1:1;const n=page+d;if(n>=0&&n<slides.length)go(n);}
else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(slides.length-1);}
else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen();}else if(e.key==='Escape')$('deck-menu').open=false;
});
window.addEventListener('hashchange',()=>go(readHash(),false));go(readHash());
})();
</script></body></html>
