<script id="slide-data" type="application/json">[{"title": "為什麼資料都在，AI 卻說不清完整原因？", "subtitle": "整份簡報只追一個問題：海燕專案為什麼延期？", "kind": "question", "phase": "先看任務", "points": [{"title": "你要的是「為什麼」", "text": "不能只知道延期，還要找出事情怎麼一路發生。"}, {"title": "線索分散在 A、B、C", "text": "三份文件都在資料庫，AI 卻不一定每次都會讀到。"}], "takeaway": "接下來看：搜尋漏掉兩份文件，會讓答案少掉什麼。", "source": [2], "note": "0:00–0:35（35 秒）。先設定同一個任務：海燕專案為什麼延期？資料庫有三份關鍵文件：A 採購記錄說零件晚到，B 測試記錄說驗收要等零件，C 會議記錄說交付要等驗收。我們想讓 AI 把三份資料接起來，解釋延期的原因。後面五頁都沿用這個問題和這三份記錄。"}, {"title": "只取前三筆，漏掉了兩份關鍵文件", "subtitle": "RAG 先搜尋，再把選中的片段交給 AI；這次固定只拿前三筆。", "kind": "retrieval", "phase": "搜尋漏掉什麼", "points": [{"title": "C 入選，A、B 沒入選", "text": "採購與測試記錄排在第四、第五，沒有送進模型。"}, {"title": "資料還在，只是沒被讀到", "text": "片段排名與取回筆數，決定 AI 這次能看到的範圍。"}], "takeaway": "這次 AI 只讀到 C，缺了 A、B 的線索。", "source": [2], "note": "0:35–1:25（50 秒）。指著名單由上往下讀。第一筆是 C 會議記錄，第二、第三是其他或舊資料。RAG 在第三筆截止，AI 只拿到這三筆。A 採購和 B 測試分別排第四、第五，雖然存在，卻沒有進入這次回答。這是為解說而設定的排序，不是實際系統測試，也不代表資料庫大就必然失敗。"}, {"title": "於是，答案卡在「為什麼沒驗收？」", "subtitle": "沿用上一頁：AI 有 C，卻沒有 A、B。", "kind": "gap", "phase": "漏檢造成的後果", "points": [{"title": "它能回答到哪裡？", "text": "C 只告訴它：尚未完成驗收，所以交付順延。"}, {"title": "真正缺的是前半段原因", "text": "沒有 A、B，就無法從驗收往前追到「零件晚到」。"}], "takeaway": "這次缺了 A、B，答案只能停在「驗收未完成」。", "source": [2, 3], "note": "1:25–2:10（45 秒）。把上一頁的漏檢接到回答上：AI 可以說「因為尚未完成驗收，所以交付順延」，因為 C 確實這樣寫。但接著問：那驗收為什麼卡住？這次沒有 A 與 B，便少了零件晚到和驗收必須等待零件的關係。圖中問號就是答案缺口，不是模型看到了全部資料卻故意忘記。這句回答是教學示意，沒有呼叫模型。"}, {"title": "Wiki 先把 A、B、C 整理成一個概念", "subtitle": "改變發生在資料加入時：逐份整理、建立關聯，再保存概念摘要。", "kind": "compile", "phase": "把缺口先連起來", "points": [{"title": "讀新資料，更新關係", "text": "把零件、驗收、交付串成一條可追查的原因鏈。"}, {"title": "把整理結果存成概念頁", "text": "建立「海燕專案／延期原因」摘要，並保留 A、B、C 來源。"}, {"title": "以後有新資料，再更新它", "text": "理解成果可以延續，不必每次提問都從散落片段重新拼。"}], "takeaway": "Wiki 多留下了一份「已經把關係整理好」的知識。", "source": [0, 1], "note": "2:10–3:20（70 秒）。現在換成 LLM Wiki 的做法。資料加入時，AI 逐份整理內容；加入 A 取得零件狀態，加入 B 連起零件和驗收，加入 C 再接到交付。整理出的關係是「零件晚到，導致驗收延後，最後交付延期」。把這段理解保存成海燕專案的延期原因概念頁，並連回原始記錄。新資料進來時，更新摘要和連結，知識網可以由這些互相連結的頁面構成。這裡描述的是整理流程，不保證任何產品都會自動正確完成全部步驟。"}, {"title": "再問同一題，這次能追到「零件晚到」", "subtitle": "Wiki 先找到已整理的「海燕專案／延期原因」概念頁，再讀摘要。", "kind": "answer", "phase": "看見回答的差別", "points": [{"title": "對照剛才那個答案", "text": "前面只能說驗收未完成；現在多了零件晚到這個前因。"}, {"title": "多出的理解來自預先整理", "text": "概念頁整合 A、B、C，保存了零件如何影響驗收與交付。"}, {"title": "需要查核，再打開來源", "text": "點下方 A、B、C，可核對本例的虛構教學記錄。"}], "takeaway": "差別：從「只知道驗收卡住」，走到「能追到零件晚到」。", "source": [0, 1], "note": "3:20–4:25（65 秒）。問同一句：海燕專案為什麼延期？左邊保留第三頁的回答：尚未完成驗收，所以交付順延。右邊讀的是上一頁保存的概念摘要：關鍵零件晚到，使驗收延後，交付也因此順延。現在答案往前追到了零件這個原因。重點是新增的關係已在資料整理時被寫進概念頁，不是查詢時突然多看見所有原始文件。需要查核，可點 A、B、C 來源按鈕。前提是找到正確且仍有效的概念頁。"}, {"title": "RAG 找片段，Wiki 保存整理好的知識", "subtitle": "回到同一個例子：前三筆漏了 A、B；Wiki 把 A、B、C 的關係先留下來。", "kind": "recap", "phase": "帶走這個差別", "points": [{"title": "RAG 可能漏在哪裡？", "text": "單次只取前 N 筆，關鍵片段在名單外就沒進入回答。"}, {"title": "Wiki 幫忙補哪一層？", "text": "預先整理摘要與知識關聯，後續可以直接讀概念。"}, {"title": "它仍然有條件", "text": "要找到對的概念、保持更新，並用原文查證；兩種方法也能結合。"}], "takeaway": "這 5 分鐘的重點：先整理關係並保存，讓下次回答有脈絡可循。", "source": [0, 1, 2], "note": "4:25–5:00（35 秒）。用同一個例子收尾：RAG 若只選前三筆，A、B 可能留在名單外，答案就少掉前因。Wiki 把 A、B、C 的關係預先整理成概念與摘要，下一次可直接讀取。它仍需要找到正確概念、更新內容和查核原文；進階 RAG 也能用多輪查詢、階層摘要等方法改善，兩者並不互斥。"}]</script><script id="source-data" type="application/json">[{"title": "Microsoft llmwiki：專案說明", "url": "https://github.com/microsoft/llmwiki", "scope": "定位、三層結構與主要功能。"}, {"title": "Microsoft llmwiki：架構文件", "url": "https://github.com/microsoft/llmwiki/blob/main/ARCHITECTURE.md", "scope": "索引、加權全文搜尋、MCP 工具、匯入與 Lint 流程。"}, {"title": "Anthropic：Contextual Retrieval", "url": "https://www.anthropic.com/research/contextual-retrieval", "scope": "片段失去上下文、精確比對、混合檢索與重排序。"}, {"title": "GraphRAG：From Local to Global", "url": "https://arxiv.org/abs/2404.16130", "scope": "全庫概括問題、關聯索引與預先產生的群組摘要。"}, {"title": "RAPTOR：Tree-Organized Retrieval", "url": "https://arxiv.org/abs/2401.18059", "scope": "階層摘要及多層次檢索；RAG 也能預先組織知識。"}]</script>

default:return `<div class="visual"><div class="recap-grid"><div class="recap-col">${icon('search')}<strong>RAG：取前 N 筆</strong><div class="recap-formula">提問 → 選片段 → 拼答案</div><p>本例漏了 A、B，<br>回答只能停在驗收未完成。</p></div><div class="recap-col green">${icon('book')}<strong>Wiki：先留概念</strong><div class="recap-formula">資料加入 → 整理、連結、保存</div><p>先留下 A、B、C 的關係，<br>下次讀概念就能追到零件。</p></div></div><div class="closing-line">Wiki 也要找到正確頁面、持續更新，並保留原始證據。</div></div>`;
}}
function render(){const s=slides[page];$('chapter').textContent=s.phase;$('page-counter').textContent=`${page+1} / ${slides.length} 頁`;$('slide-title').textContent=s.title;$('slide-subtitle').textContent=s.subtitle;$('report-lead').textContent=s.phase;$('report-points').innerHTML=s.points.map(p=>`<div class="point"><h2>${esc(p.title)}</h2><p>${esc(p.text)}</p></div>`).join('');$('art').innerHTML=scene();$('takeaway').textContent=s.takeaway;$('scene-caption').textContent=page===1?'排序為人為設定的教學示意，非實測':page===4?'A、B、C 均為可點閱的虛構教學記錄':'同一組教學案例，逐頁接續說明';$('detail').innerHTML='依據：'+s.source.map(n=>`<a href="${sources[n].url}" target="_blank" rel="noopener noreferrer">${esc(sources[n].title)}</a>`).join('、');$('total-position').textContent=`${page+1} / ${slides.length} 頁`;$('track').style.width=`${(page+1)/slides.length*100}%`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;$('announcement').textContent=`第 ${page+1} 頁，共 ${slides.length} 頁：${s.title}`;document.title=s.title+'｜從 RAG 到 LLM Wiki';try{localStorage.setItem('presentation-hub:progress:rag-to-wiki',JSON.stringify({slide:page+1,total:slides.length,visitedAt:Date.now()}));}catch{}}
function go(n,write=true){document.activeElement?.blur();page=Math.max(0,Math.min(slides.length-1,n));render();$('main').scrollTop=0;if(write)history.replaceState(null,'',`#slide-${page+1}`);}
function move(n){const target=page+n;if(target>=0&&target<slides.length)go(target);}
function readHash(){const m=location.hash.match(/^#slide-(\d+)$/);return m?Number(m[1])-1:0;}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}}
function openResources(){$('deck-menu').open=false;$('resources').showModal();}
$('resources-body').innerHTML=`<h3>一個案例，六個連續步驟</h3><p>本簡報以單次「取前 N 筆」的片段式 RAG 為比較對象；LLM Wiki 以 <a href="${sources[0].url}" target="_blank" rel="noopener noreferrer">Microsoft llmwiki</a> 的知識整理方法為參考。進階 RAG 也可以多輪檢索、建立階層摘要；Wiki 仍需檢索，兩者能結合。</p><p>海燕專案、排序與示例回答均為虛構教學情境，沒有呼叫模型或量測準確率。例子刻意讓 A、B 排在前三筆之外，用來展示證據缺口。查核日期：2026-10-27。</p><h3>5 分鐘講述節奏</h3>${slides.map((s,i)=>`<details><summary>${i+1}. ${esc(s.title)}</summary><p>${esc(s.note)}</p></details>`).join('')}<h3>原始資料與研究</h3><ol>${sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><small>${esc(s.scope)}</small></li>`).join('')}</ol><p><a href="notes.html">開啟 5 分鐘講稿</a> · <a href="speaker-notes.md">純文字講稿</a></p>`;
$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('fullscreen').addEventListener('click',fullscreen);$('menu-fullscreen').addEventListener('click',()=>{$('deck-menu').open=false;fullscreen();});$('sources-open').addEventListener('click',openResources);$('menu-sources').addEventListener('click',openResources);$('resources-close').addEventListener('click',()=>$('resources').close());$('evidence-close').addEventListener('click',()=>$('evidence').close());
$('art').addEventListener('click',e=>{const button=e.target.closest('[data-evidence]');if(!button)return;const r=records[Number(button.dataset.evidence)];$('evidence-title').textContent=`${r.id} · ${r.title}`;$('evidence-text').textContent=r.text;$('evidence').showModal();});
document.addEventListener('click',e=>{if(!e.target.closest('#deck-menu'))$('deck-menu').open=false;});
document.addEventListener('keydown',e=>{if($('resources').open||$('evidence').open||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,summary'))return;if(e.key===' '&&e.target.closest('button,a'))return;if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp',' '].includes(e.key)){e.preventDefault();move(e.key==='ArrowLeft'||e.key==='ArrowUp'||(e.key===' '&&e.shiftKey)?-1:1);}else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(slides.length-1);}else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen();}else if(e.key==='Escape')$('deck-menu').open=false;});
window.addEventListener('hashchange',()=>go(readHash(),false));go(readHash());
})();
</script></body></html>
