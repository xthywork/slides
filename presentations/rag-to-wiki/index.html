case 'pipeline':return `<div class="api-visual"><div class="api-label">${icon('question')}問題進來後，RAG 先選資料</div><div class="process-flow"><div class="process-item">${icon('database')}<strong>資料庫</strong><small>保存所有文件與片段</small></div>${arrow()}<div class="process-item selected"><div class="top-k-sample"><span>1</span><span>2</span><span>… K</span></div><strong>檢索 Top-K</strong><small>只挑排名靠前的結果</small></div>${arrow()}<div class="process-item">${icon('book')}<strong>LLM 閱讀回答</strong><small>本次上下文只有選中資料</small></div></div><div class="api-rule">K 之後的資料，<strong>即使正確，也沒有被送進去</strong>。</div></div>`;
case 'issues':return `<div class="api-visual"><table class="issues-table"><thead><tr><th scope="col">問題</th><th scope="col">會發生什麼事？</th></tr></thead><tbody>${issues.map(([i,t,d])=>`<tr><td>${icon(i)}${t}</td><td>${d}</td></tr>`).join('')}</tbody></table><div class="api-rule">增加 K 可能找回更多資料，也會增加上下文與雜訊；仍需改善排序和資料品質。</div></div>`;
case 'similarity':return `<div class="api-visual"><div class="semantic-grid"><div class="semantic-col">${icon('search')}<small>語意很接近</small><strong>故障報告<br>監控紀錄<br>504 錯誤分析</strong><p>都在說「API 逾時」，卻可能只記錄現象。</p></div><div class="semantic-col cause">${icon('doc')}<small>原因可能寫在另一種描述裡</small><strong>付款閘道<br>連線池設定錯誤</strong><p>解釋故障的變更文件，可能只排在 Top-6。</p></div></div><div class="mini-cutoff">系統只取 Top-5，原因文件就留在名單之外。</div></div>`;
case 'case':return `<div class="api-visual"><div class="case-question">為什麼 8 月 15 日下午，<br>訂單結帳 API 突然大量逾時？</div><div class="case-metrics"><div class="case-metric"><b>100 萬筆</b><span>日誌、故障報告、客服紀錄<br>與部署變更紀錄</span></div><div class="case-metric"><b>Top-5</b><span>向量搜尋<br>本次只取前五筆</span></div></div><div class="case-note">本例真正原因：CHG-2841 部署變更中的付款閘道連線池設定錯誤。</div></div>`;
case 'results':return `<div class="api-visual"><table class="results-table"><thead><tr><th scope="col">排名</th><th scope="col">找到的文件（可點閱示意內容）</th><th scope="col" class="score-heading">相似度</th><th scope="col" class="score-heading">本次閱讀</th></tr></thead><tbody>${docs.map((d,i)=>`${i===5?'<tr class="cutoff-row"><td colspan="4">Top-5 截止線：下方原因文件沒有進入本次上下文</td></tr>':''}<tr class="${i===5?'cause-row':''}"><td>Top ${i+1}</td><td>${docLink(d,i)}</td><td>${d.score}%</td><td>${i===5?'未入選':'已入選'}</td></tr>`).join('')}</tbody></table><div class="score-disclaimer">相似度為假設數值，僅供排序示意；不是模型準確率或答案正確機率。事件與文件內容均為虛構案例。</div></div>`;
case 'why':return `<div class="api-visual"><div class="keyword-groups"><div class="keyword-group"><strong>Top 1–5：描述現象</strong><div class="term-list"><span>訂單 API</span><span>逾時</span><span>8/15</span><span>504</span></div><small>用字與提問接近，語意相似度高。</small></div><div class="keyword-group cause"><strong>Top 6：描述原因</strong><div class="term-list"><span>付款閘道</span><span>連線池</span><span>設定錯誤</span></div><small>描述角度不同，原因文件排名較後。</small></div></div><div class="symptom-answer">LLM 可能只回答：「當天下午 API 回應變慢，出現大量 504。」<br><strong>仍缺：什麼設定變更造成這件事？</strong></div></div>`;
case 'compile':return `<div class="api-visual"><div class="ingest-flow"><div class="source-stack" aria-label="本例六份原始文件">${docs.map((d,i)=>`<div class="source-token ${i===5?'cause':''}">${icon('doc')}${d.short}</div>`).join('')}</div>${arrow()}<div class="synthesis">${icon('link')}<strong>LLM 分析、整合關係</strong><div class="relation-words"><span>故障現象</span>${icon('link')}<span>根本原因</span>${icon('link')}<span>證據</span></div></div></div><div class="save-artifact">${icon('book')}<div>建立故障事件 Wiki 頁面<small>整合六份關聯文件；保存摘要、來源，並持續更新。</small></div></div><div class="api-rule">把「這份變更，造成那個故障」的關係<strong>先留下來</strong>。</div></div>`;
case 'wiki':return `<div class="api-visual"><div class="wiki-view"><div class="wiki-main"><div class="wiki-path">wiki / events / 08-15-order-api.md · 教學展示頁</div><div class="wiki-block"><h3>事件現象</h3><p>訂單結帳 API 大量逾時，<br>發生 504 錯誤。</p></div><div class="wiki-block wiki-root"><h3>根本原因 · CHG-2841</h3><p>部署時，付款閘道連線池上限誤設。</p><div class="config-change" aria-label="連線池上限由 200 誤設為 20"><span class="before">200</span>${icon('arrow')}<span class="after">20</span></div><p>在本例負載下，可用連線不足，<br>導致請求阻塞。</p></div></div><div class="wiki-evidence"><h3>關聯資料與證據</h3><div class="evidence-links">${docs.map((d,i)=>`<button class="evidence-link ${i===5?'cause':''}" data-evidence="${i}" aria-label="查看 ${esc(d.title)}（虛構教學文件）">${icon('doc')}${d.title}</button>`).join('')}</div><div class="cause-chain-small">連線池縮小 → 請求等待、阻塞 → API 逾時<br>事件與 CHG-2841 已連在同一個脈絡中。</div></div></div></div>`;
case 'query':return `<div class="api-visual"><div class="api-label">${icon('question')}同樣問：8/15 訂單 API 為什麼逾時？</div><div class="query-lanes"><div class="query-lane"><div class="lane-label">傳統 RAG</div><div class="lane-node">檢索原始文件 Top-5<small>沒有選中 CHG-2841</small></div>${arrow()}<div class="lane-result"><strong>只取得故障現象</strong><small>原因文件仍在 Top-6</small></div></div><div class="query-lane wiki"><div class="lane-label">LLMWiki</div><div class="lane-node">找到故障事件 Wiki 頁<small>已連到 CHG-2841</small></div>${arrow()}<div class="lane-result"><strong>讀到原因與證據</strong><small>連線池 200 → 20，導致請求阻塞</small></div></div></div><div class="api-rule">關聯是在<strong>上一個資料整理階段</strong>建立，這次可以直接沿用。</div></div>`;
case 'comparison':return `<div class="api-visual"><table class="comparison-table"><thead><tr><th scope="col">比較項目</th><th scope="col">傳統 RAG（單次片段檢索）</th><th scope="col">LLMWiki 式知識管理</th></tr></thead><tbody>${comparison.map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="condition-note">LLMWiki 並非保證找到所有答案。前提是整理階段能正確辨識關係，查詢時能找到對應知識頁，且內容仍有效。進階 RAG 也能多輪檢索、建立摘要與關聯。</div></div>`;
default:return `<div class="api-visual"><div class="conclusion-grid"><div class="conclusion-col">${icon('search')}<strong>檢索相關內容</strong><p>RAG 的 Top-K 決定<br>這次模型看得到哪些資料。</p><p>資料存在、語意相似，<br>仍不保證真正原因入選。</p></div><div class="conclusion-col green">${icon('book')}<strong>先整理知識關聯</strong><p>LLMWiki 先建立<br>事件、原因與證據的關係。</p><p>讓下次查詢更容易<br>從事件找到正確答案。</p></div></div><div class="api-rule">本例的重點：讓<strong>故障事件</strong>與<strong> CHG-2841 根因</strong>一起被找到。</div></div>`;
}}
function render(){const s=slides[page];document.querySelector('.content').classList.toggle('layout-wide',s.wide);document.querySelector('.content').classList.toggle('cover-slide',page===0);$('chapter').textContent=s.phase;$('page-counter').textContent=`${page+1} / ${slides.length} 頁`;$('slide-title').textContent=s.title;$('slide-subtitle').textContent=s.subtitle;$('case-context').textContent=page<4?'單次向量 Top-K 檢索：資料存在 ≠ 本次讀到':page<10?'同一案例：8/15 下午訂單 API 逾時 · CHG-2841':'比較焦點：知識關聯在什麼時候建立？';$('report-lead').textContent=s.phase;$('report-points').innerHTML=s.points.map(p=>`<div class="point"><h2>${esc(p.title)}</h2><p>${esc(p.text)}</p></div>`).join('');$('art').innerHTML=scene();$('takeaway').textContent=s.takeaway;$('scene-caption').textContent=page>=4&&page<=9?'事件、文件、資料量與分數均為假設教學情境':'架構示意：比較單次原始片段檢索與 Wiki 式知識管理';$('detail').innerHTML=s.source.length?'參考：'+s.source.map(n=>`<a href="${sources[n].url}" target="_blank" rel="noopener noreferrer">${esc(sources[n].title)}</a>`).join('、'):'案例說明：100 萬筆資料、六份文件與相似度均為教學設定，非實測數據。';$('total-position').textContent=`${page+1} / ${slides.length} 頁`;$('track').style.width=`${(page+1)/slides.length*100}%`;$('prev').disabled=page===0;$('next').disabled=page===slides.length-1;$('announcement').textContent=`第 ${page+1} 頁，共 ${slides.length} 頁：${s.title}`;document.title=s.title+'｜RAG × LLMWiki';try{localStorage.setItem('presentation-hub:progress:rag-to-wiki',JSON.stringify({slide:page+1,total:slides.length,visitedAt:Date.now()}));}catch{}}
function go(n,write=true){document.activeElement?.blur();page=Math.max(0,Math.min(slides.length-1,n));render();$('main').scrollTop=0;$('art').scrollTop=0;if(write)history.replaceState(null,'',`#slide-${page+1}`);}
function move(n){const target=page+n;if(target>=0&&target<slides.length)go(target);}
function readHash(){const m=location.hash.match(/^#slide-(\d+)$/);return m?Number(m[1])-1:0;}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}}
function openResources(){$('deck-menu').open=false;$('resources').showModal();}
$('resources-body').innerHTML=`<h3>範圍與讀法</h3><p>依序閱讀四部分：RAG 問題與限制（1–4）、訂單 API 案例（5–7）、LLMWiki 解決思路（8–10）、比較與總結（11–12）。方向鍵與空白鍵切頁；第 6、9 頁可點文件查看虛構教學內容。</p><p>本簡報的「傳統 RAG」指單次向量 Top-K 原始片段檢索。RAG 也可使用混合檢索、多輪查詢、階層摘要、重排序或關係圖。LLMWiki 以 <a href="${sources[0].url}" target="_blank" rel="noopener noreferrer">Microsoft llmwiki</a> 的持久 Wiki 整理概念為參考；圖為解決思路，不宣稱某個產品預設完成所有步驟。</p><p>知識關聯可用互相連結的 Markdown 頁面表達，不一定使用圖形資料庫。資料加入時仍需正確整合、追蹤來源與更新；查詢時仍需找到對應頁面。</p><h3>案例資料聲明</h3><p>8/15 事件、100 萬筆資料、六份文件、Top-5 排名及所有相似度均為假設教學設定，不是實測準確率或真實事故；本頁沒有呼叫模型或查詢後端服務。96% 等分數只作排序示意，不等於答案正確機率。</p><h3>逐頁講稿</h3>${slides.map((s,i)=>`<details><summary>${i+1}. ${esc(s.title)}</summary><p>${esc(s.note)}</p></details>`).join('')}<h3>參考來源</h3><ol>${sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><small>${esc(s.scope)}</small></li>`).join('')}</ol><p><a href="notes.html">開啟講稿大綱</a> · <a href="speaker-notes.md">純文字講稿</a></p>`;
$('prev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1));$('fullscreen').addEventListener('click',fullscreen);$('menu-fullscreen').addEventListener('click',()=>{$('deck-menu').open=false;fullscreen();});$('sources-open').addEventListener('click',openResources);$('menu-sources').addEventListener('click',openResources);$('resources-close').addEventListener('click',()=>$('resources').close());$('evidence-close').addEventListener('click',()=>$('evidence').close());
$('art').addEventListener('click',e=>{const button=e.target.closest('[data-evidence]');if(!button)return;const d=docs[Number(button.dataset.evidence)];$('evidence-title').textContent=d.title;$('evidence-text').textContent=d.body;$('evidence').showModal();});
document.addEventListener('click',e=>{if(!e.target.closest('#deck-menu'))$('deck-menu').open=false;});
document.addEventListener('keydown',e=>{if($('resources').open||$('evidence').open||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,summary'))return;if(e.key===' '&&e.target.closest('button,a'))return;if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp',' '].includes(e.key)){e.preventDefault();move(e.key==='ArrowLeft'||e.key==='ArrowUp'||(e.key===' '&&e.shiftKey)?-1:1);}else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(slides.length-1);}else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen();}else if(e.key==='Escape')$('deck-menu').open=false;});
window.addEventListener('hashchange',()=>go(readHash(),false));go(readHash());
})();

</script></body></html>
