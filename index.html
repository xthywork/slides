 let favorites=new Set(),toastTimer;
 const icon=(name)=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
 const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
 function save(key,value){try{localStorage.setItem(key,JSON.stringify(value));return true}catch{return false}}
 function notify(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
 function loadFavorites(){const values=read(favoriteKey,[]);favorites=new Set(Array.isArray(values)?values.filter(v=>typeof v==='string'):[])}
 function pathAllowed(value,prefix){return typeof value==='string'&&value.startsWith(prefix)&&!value.includes('..')&&!/[?#\\:]/.test(value)}
 function progress(entry){const p=read('presentation-hub:progress:'+entry.id,null);if(!p||!Number.isFinite(p.slide)||!Number.isFinite(p.visitedAt))return null;return{slide:Math.max(1,Math.min(entry.slides,Math.floor(p.slide))),visitedAt:p.visitedAt}}
 function entryCard(entry){const p=progress(entry),favorite=favorites.has(entry.id),card=document.createElement('article');card.className='presentation-card';card.dataset.id=entry.id;const date=entry.updated.replaceAll('-',' / ');card.innerHTML=`<div class="cover"><a class="cover-link" href="${esc(entry.path)}" aria-label="開啟 ${esc(entry.title)} 簡報"><img src="${esc(entry.cover)}" alt="${esc(entry.title)} 圖像簡報封面" width="900" height="600"><span class="cover-open">${icon('play')}</span></a><button class="favorite" type="button" aria-pressed="${favorite}" aria-label="${favorite?'取消收藏':'收藏'} ${esc(entry.title)}" title="${favorite?'取消收藏':'加入收藏'}">${favorite?'★':'☆'}</button></div><div class="card-body"><div class="card-meta"><span class="category-label">${esc(entry.category)}</span><time datetime="${esc(entry.updated)}">更新 ${esc(date)}</time></div><h2 class="card-title"><a href="${esc(entry.path)}">${esc(entry.title)}</a></h2><p class="card-subtitle">${esc(entry.subtitle)}</p><p class="card-description">${esc(entry.description)}</p><div class="tags"><span class="tag slide-count">${entry.slides} 頁</span>${entry.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="card-actions"><a class="button primary" href="${esc(entry.path)}">${icon('play')}開啟簡報</a>${entry.notes?`<a class="button" href="${esc(entry.notes)}">摘要講稿 ↗</a>`:''}</div><div class="read-progress">${p?`<span>上次停在第 ${p.slide} / ${entry.slides} 頁</span><span class="track"><span style="width:${Math.round(p.slide/entry.slides*100)}%"></span></span><a href="${esc(entry.path)}#slide-${p.slide}">接續閱讀 ↗</a>`:'<span>圖像解說與原版介面，自由切換。</span><span style="margin-left:auto">隨時開始</span>'}</div></div>`;card.querySelector('.favorite').addEventListener('click',()=>{if(favorites.has(entry.id))favorites.delete(entry.id);else favorites.add(entry.id);if(!save(favoriteKey,[...favorites]))notify('這個瀏覽器目前無法保存收藏，仍可在這次瀏覽中使用。');render()});return card}
 function render(){const q=state.query.trim().toLocaleLowerCase(),entries=state.entries.filter(e=>(state.scope!=='favorites'||favorites.has(e.id))&&(state.category==='all'||e.category===state.category)&&(!q||[e.title,e.subtitle,e.description,e.category,...e.tags].join(' ').toLocaleLowerCase().includes(q)));entries.sort((a,b)=>state.sort==='title'?a.title.localeCompare(b.title,'zh-TW'):state.sort==='visited'?(progress(b)?.visitedAt||0)-(progress(a)?.visitedAt||0):b.updated.localeCompare(a.updated));$('all-count').textContent=String(state.entries.length);$('favorite-count').textContent=String(state.entries.filter(e=>favorites.has(e.id)).length);document.querySelectorAll('[data-scope]').forEach(b=>{b.classList.toggle('active',b.dataset.scope===state.scope);b.setAttribute('aria-pressed',String(b.dataset.scope===state.scope))});document.querySelectorAll('[data-category]').forEach(b=>{b.classList.toggle('active',b.dataset.category===state.category);b.setAttribute('aria-pressed',String(b.dataset.category===state.category))});$('library').dataset.count=String(entries.length);$('result-count').textContent=state.scope==='favorites'?`已收藏 · ${entries.length} 份簡報`:`簡報書架 · ${entries.length} 份簡報`;$('library').replaceChildren(...entries.map(entryCard));if(!entries.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML=icon('slides')+`<h2>${state.scope==='favorites'&&!q&&state.category==='all'?'還沒有收藏的簡報':'沒有符合條件的簡報'}</h2><p>${state.scope==='favorites'&&!q?'在簡報封面按一下星號，就能把它收進這裡。':'換個關鍵字，或回到全部主題看看。'}</p><button class="button" id="reset-filter">瀏覽全部簡報</button>`;$('library').append(empty);$('reset-filter').addEventListener('click',()=>{state.scope='all';state.category='all';state.query='';$('search').value='';render()})}}
 async function loadCatalog(){try{const response=await fetch('presentations.json',{cache:'no-store'});if(!response.ok)throw Error('catalog');const catalog=await response.json();if(catalog.version!==1||!Array.isArray(catalog.presentations))throw Error('schema');const ids=new Set();for(const e of catalog.presentations){if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(e.id)||ids.has(e.id)||!e.title||!e.category||!Number.isInteger(e.slides)||e.slides<1||!/^\d{4}-\d{2}-\d{2}$/.test(e.updated)||!Array.isArray(e.tags)||!pathAllowed(e.path,'presentations/')||!pathAllowed(e.cover,'assets/')||(e.notes&&!pathAllowed(e.notes,'presentations/')))throw Error('entry');ids.add(e.id)}state.entries=catalog.presentations;const categories=[...new Set(state.entries.map(e=>e.category))];$('categories').querySelectorAll('[data-category]:not([data-category="all"])').forEach(e=>e.remove());for(const category of categories){const b=document.createElement('button');b.className='category';b.dataset.category=category;b.textContent=category;b.setAttribute('aria-pressed','false');$('categories').append(b)}render()}catch{$('result-count').textContent='清單暫時無法載入';$('library').dataset.count='0';$('library').innerHTML='<div class="error-state">目前無法打開簡報清單，請確認網站連線後再試一次。<br><button class="button" id="retry">重新載入清單</button></div>';$('retry').addEventListener('click',loadCatalog)}}
 document.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click',()=>{state.scope=b.dataset.scope;render()}));$('categories').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;state.category=b.dataset.category;render()});$('search').addEventListener('input',e=>{state.query=e.target.value;render()});$('sort').addEventListener('change',e=>{state.sort=e.target.value;render()});window.addEventListener('storage',()=>{loadFavorites();render()});window.addEventListener('pageshow',()=>{if(state.entries.length){loadFavorites();render()}});
 const form=$('brief-form'),fields=['topic','audience','pages','style','points'];
 function storeDraft(){return save(draftKey,Object.fromEntries(fields.map(k=>[k,form.elements[k].value])))}
 function openBrief(){const draft=read(draftKey,{});for(const k of fields)if(typeof draft[k]==='string')form.elements[k].value=draft[k];$('brief-output').hidden=true;$('brief-dialog').showModal();form.elements.topic.focus()}
 document.querySelectorAll('[data-open-brief]').forEach(b=>b.addEventListener('click',openBrief));$('brief-close').addEventListener('click',()=>$('brief-dialog').close());form.addEventListener('input',storeDraft);form.addEventListener('change',storeDraft);$('brief-clear').addEventListener('click',()=>{form.reset();storeDraft();$('brief-output').hidden=true;form.elements.topic.focus()});$('brief-dialog').addEventListener('click',e=>{if(e.target!==$('brief-dialog'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()});
 form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;storeDraft();const text=`請在我的「簡報室」新增一份繁體中文互動簡報。\n\n主題：${form.elements.topic.value.trim()}\n聽眾：${form.elements.audience.value}\n預計頁數：約 ${form.elements.pages.value} 頁\n呈現方式：${form.elements.style.value}\n重點：${form.elements.points.value.trim()||'請依主題整理用途、原理與重要資訊。'}\n\n請一併製作簡易摘要講稿。完成後收錄到簡報入口，保留既有作品的網址與內容。`;const output=$('brief-text');output.value=text;$('brief-output').hidden=false;let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);copied=true}}catch{}if(!copied){output.focus();output.select();try{copied=document.execCommand('copy')}catch{}}$('brief-copy-status').textContent=copied?'已複製！把需求貼給我，就能開始製作下一份簡報。':'需求已整理好，請選取下方文字複製。';notify(copied?'製作需求已複製。':'已產生製作需求，可在下方選取複製。')});
 loadFavorites();loadCatalog();
})();
</script>
</body></html>
