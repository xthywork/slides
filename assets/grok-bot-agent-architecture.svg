<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Grok Bot：Agent 團隊架構</title>
  <desc id="desc">人定目標，Gummy 統籌後分派給信件、專案與行銷角色，再由執行者交付並回報。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6e8565"/></marker></defs>
  <rect width="900" height="600" fill="#f6f5ef"/>
  <g font-family="system-ui,'Microsoft JhengHei',sans-serif" fill="#202b27">
