    <text x="62" y="139" font-size="52" font-weight="700">Grok Bot</text>
    <text x="62" y="194" font-size="36" font-weight="650">把 AI 團隊的責任接起來</text>
    <g fill="none" stroke="#6e8565" stroke-width="2.5" marker-end="url(#arrow)">
