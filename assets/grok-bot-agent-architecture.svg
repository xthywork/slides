      <path d="M476 342H552"/><path d="M476 342V415H552"/>
      <path d="M683 269H741V342H775"/><path d="M683 342H775"/><path d="M683 415H741V342H775"/>
      <path d="M811 383V500H127V389" stroke-dasharray="8 7"/>
    </g>
    <circle cx="127" cy="342" r="42" fill="#fffefa" stroke="#adbea2" stroke-width="2"/>
    <text x="127" y="350" text-anchor="middle" font-size="23">你</text>
    <rect x="305" y="306" width="116" height="72" rx="36" fill="#202b27"/>
    <text x="363" y="350" text-anchor="middle" font-size="23" fill="#d1ecb7">Gummy</text>
    <g fill="#d1ecb7" stroke="#adbea2" stroke-width="1.5">
      <rect x="552" y="240" width="132" height="58" rx="29"/>
      <rect x="552" y="313" width="132" height="58" rx="29"/>
      <rect x="552" y="386" width="132" height="58" rx="29"/>
